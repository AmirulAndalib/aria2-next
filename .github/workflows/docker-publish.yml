name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish. Leave empty to use the latest release."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Release
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.release.outputs.image }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REQUESTED_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Resolve release
        id: release
        run: |
          tag=$REQUESTED_TAG
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName --jq .tagName)
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          resolved_tag=$(gh release view "$tag" --json tagName --jq .tagName)
          if [ "$resolved_tag" != "$tag" ]; then
            echo "Release tag mismatch: requested $tag, resolved $resolved_tag" >&2
            exit 1
          fi

          version=${tag#v}
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=$image"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            target_arch: amd64
            asset_arch: x86_64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target_arch: arm64
            asset_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Download release Linux assets
        run: |
          version="${{ needs.resolve.outputs.version }}"
          mkdir -p release-assets
          gh release download "${{ needs.resolve.outputs.tag }}" \
            --pattern "aria2-next-${version}-linux-${{ matrix.asset_arch }}" \
            --dir release-assets
          test -f "release-assets/aria2-next-${version}-linux-${{ matrix.asset_arch }}"

      - name: Prepare container context
        run: |
          version="${{ needs.resolve.outputs.version }}"
          mkdir -p "docker-context/linux-${{ matrix.target_arch }}"
          cp packaging/docker/Dockerfile docker-context/Dockerfile
          cp packaging/docker/aria2.conf docker-context/aria2.conf
          cp packaging/docker/entrypoint.sh docker-context/entrypoint.sh
          cp "release-assets/aria2-next-${version}-linux-${{ matrix.asset_arch }}" \
            "docker-context/linux-${{ matrix.target_arch }}/aria2-next"
          chmod 755 "docker-context/linux-${{ matrix.target_arch }}/aria2-next"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: docker-context
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.resolve.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digests-${{ matrix.target_arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish Manifest
    needs:
      - resolve
      - build
    permissions:
      actions: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        run: |
          image="${{ needs.resolve.outputs.image }}"
          refs=
          for digest in /tmp/digests/*; do
            refs="$refs $image@sha256:$(basename "$digest")"
          done
          docker buildx imagetools create \
            -t "$image:${{ needs.resolve.outputs.tag }}" \
            -t "$image:latest" \
            $refs
          docker buildx imagetools inspect "$image:latest"

      - name: Write publish summary
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          {
            echo "## Docker image published"
            echo
            echo "aria2-next \`$VERSION\` was published as \`$IMAGE:$RELEASE_TAG\` and \`$IMAGE:latest\` for \`linux/amd64\` and \`linux/arm64\`."
            echo
            echo "The image was assembled from the Linux binaries in [GitHub Release \`$RELEASE_TAG\`]($release_url). Both tags reference the published multi-architecture manifest."
          } >> "$GITHUB_STEP_SUMMARY"
